# TASK-127 — compila o executável Windows e o publica numa Release do GitHub.
# Os programas instalados (services/auto_updater.py) consultam a Release mais recente e oferecem a atualização.
# Como usar:  python scripts/release.py 2.1.0   (atualiza a versão, faz o commit e cria a tag v2.1.0)  →  git push origin main --tags
name: Release do executável (Windows)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Versão do programa = tag
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"${VERSAO}\"/" config.py
          grep '^APP_VERSION' config.py

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar (PyInstaller)
        shell: cmd
        env:
          CI: 'true'
        run: build.bat

      - name: SHA-256 do executável (OrcaCore.exe + cópias com os nomes antigos)
        shell: pwsh
        run: |
          # TASK-152/156: o programa passou de Leitor_Projetos.exe para GridR.exe e agora para OrcaCore.exe. Quem ainda roda uma versão antiga procura o nome antigo na Release para se atualizar,
          # então publicamos o MESMO binário com os três nomes (e um .sha256 para cada). As cópias antigas podem sair em alguma versão futura.
          Copy-Item dist\OrcaCore.exe dist\GridR.exe
          Copy-Item dist\OrcaCore.exe dist\Leitor_Projetos.exe
          foreach ($n in 'OrcaCore.exe', 'GridR.exe', 'Leitor_Projetos.exe') {
            $h = (Get-FileHash "dist\$n" -Algorithm SHA256).Hash.ToLower()
            "$h  $n" | Out-File -Encoding ascii "dist\$n.sha256"
            Get-Content "dist\$n.sha256"
          }

      - name: DLLs do plugin do nanoCAD (vão junto na Release; o .exe também as traz e instala)
        shell: bash
        run: |
          cp plugin_nanocad/appload/nanoCAD26/OrcamentoNanoCAD.dll dist/OrcamentoNanoCAD_nanoCAD26.dll
          cp plugin_nanocad/appload/nanoCAD5/OrcamentoNanoCAD.dll dist/OrcamentoNanoCAD_nanoCAD5.dll

      - name: Publicar a Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/OrcaCore.exe dist/OrcaCore.exe.sha256 dist/GridR.exe dist/GridR.exe.sha256 dist/Leitor_Projetos.exe dist/Leitor_Projetos.exe.sha256 dist/OrcamentoNanoCAD_nanoCAD26.dll dist/OrcamentoNanoCAD_nanoCAD5.dll --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/OrcaCore.exe dist/OrcaCore.exe.sha256 dist/GridR.exe dist/GridR.exe.sha256 dist/Leitor_Projetos.exe dist/Leitor_Projetos.exe.sha256 dist/OrcamentoNanoCAD_nanoCAD26.dll dist/OrcamentoNanoCAD_nanoCAD5.dll \
              --title "OrçaCore ${GITHUB_REF_NAME}" --generate-notes
          fi
