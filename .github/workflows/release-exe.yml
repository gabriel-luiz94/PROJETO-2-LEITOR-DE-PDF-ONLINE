# TASK-127/206 — compila o portátil e o instalador Windows a partir do mesmo binário.
# Para publicar, use scripts/release.py X.Y.Z e envie o commit e a tag vX.Y.Z.
name: Release do executável (Windows)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - '.github/workflows/release-exe.yml'
      - 'installer/**'
      - 'build.bat'
      - 'services/auto_updater.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Determinar a versão do executável e do instalador
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSAO="${GITHUB_REF_NAME#v}"
          else
            VERSAO="$(sed -n 's/^APP_VERSION = "\([0-9.]*\)".*/\1/p' config.py)"
          fi
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$VERSAO\"/" config.py
          echo "ORCACORE_VERSION=$VERSAO" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar o executável (PyInstaller)
        shell: cmd
        env:
          CI: 'true'
        run: build.bat

      - name: Compilar o instalador por usuário (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path "${env:ProgramFiles(x86)}" 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar o Inno Setup no runner.' }
          }
          & $iscc "/DAppVersion=$env:ORCACORE_VERSION" 'installer\OrcaCore.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar o instalador.' }

      - name: Verificar instalação, atualização e desinstalação no Windows
        shell: pwsh
        run: ./installer/verificar-windows.ps1

      - name: Preparar executáveis legados e SHA-256
        shell: pwsh
        run: |
          # Versões antigas procuram pelo nome antigo para atualizar.
          Copy-Item dist\OrcaCore.exe dist\GridR.exe
          Copy-Item dist\OrcaCore.exe dist\Leitor_Projetos.exe
          foreach ($n in 'OrcaCore.exe', 'OrcaCore-Setup.exe', 'GridR.exe', 'Leitor_Projetos.exe') {
            $h = (Get-FileHash "dist\$n" -Algorithm SHA256).Hash.ToLower()
            "$h  $n" | Out-File -Encoding ascii "dist\$n.sha256"
          }

      - name: Preparar DLLs do plugin do nanoCAD
        shell: bash
        run: |
          cp plugin_nanocad/appload/nanoCAD26/OrcamentoNanoCAD.dll dist/OrcamentoNanoCAD_nanoCAD26.dll
          cp plugin_nanocad/appload/nanoCAD5/OrcamentoNanoCAD.dll dist/OrcamentoNanoCAD_nanoCAD5.dll

      - name: Guardar os arquivos Windows
        uses: actions/upload-artifact@v4
        with:
          name: orcacore-windows
          path: |
            dist/*.exe
            dist/*.sha256
            dist/OrcamentoNanoCAD_*.dll
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orcacore-windows
          path: dist

      - name: Publicar a Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          arquivos=(
            dist/OrcaCore.exe dist/OrcaCore.exe.sha256 dist/GridR.exe dist/GridR.exe.sha256 dist/Leitor_Projetos.exe dist/Leitor_Projetos.exe.sha256
            dist/OrcaCore-Setup.exe dist/OrcaCore-Setup.exe.sha256
            dist/OrcamentoNanoCAD_nanoCAD26.dll dist/OrcamentoNanoCAD_nanoCAD5.dll
          )
          for arquivo in "${arquivos[@]}"; do
            [[ -s "$arquivo" ]]
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${arquivos[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${arquivos[@]}" --verify-tag \
              --title "OrçaCore $GITHUB_REF_NAME" --generate-notes
          fi
