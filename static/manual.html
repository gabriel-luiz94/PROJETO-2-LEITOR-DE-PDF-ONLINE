<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual — regras e ajustes</title>
<style>
:root { --bg:#fff; --fg:#1b1f24; --mut:#5b6573; --line:#d8dee6; --code:#f1f4f8; --ac:#1f6feb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1318; --fg:#e4e8ee; --mut:#9aa6b6; --line:#2a323d; --code:#1a212b; --ac:#6ea8ff; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
header.bar { position: sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; gap:12px; align-items:center; z-index:2; }
header.bar a, header.bar button { color:var(--ac); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; font:inherit; cursor:pointer; text-decoration:none; }
h1 { font-size:1.8rem; } h2 { font-size:1.35rem; margin-top:2rem; border-bottom:1px solid var(--line); padding-bottom:4px; } h3 { font-size:1.1rem; margin-top:1.5rem; }
code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:.9em; }
pre { background:var(--code); padding:12px; border-radius:8px; overflow-x:auto; border:1px solid var(--line); }
pre code { background:none; padding:0; }
table { border-collapse:collapse; display:block; overflow-x:auto; }
th, td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
th { background:var(--code); }
#msg { color:var(--mut); }
</style>
</head>
<body>
<header class="bar"><a href="/resumo">← Voltar ao Resumo</a><button type="button" onclick="window.print()">Imprimir</button></header>
<main class="wrap"><p id="msg">Carregando o manual…</p><article id="conteudo"></article></main>
<script src="/static/auth_fetch.js"></script>
<script>
(function () {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<em>$2</em>');
    const linhasTabela = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());

    function render(md) {
        const L = md.replace(/\r/g, '').split('\n'), out = [];
        let i = 0;
        while (i < L.length) {
            const l = L[i];
            if (l.startsWith('```')) {
                const buf = []; i++;
                while (i < L.length && !L[i].startsWith('```')) buf.push(L[i++]);
                i++;
                out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
            } else if (/^#{1,3} /.test(l)) {
                const n = l.match(/^#+/)[0].length;
                out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`); i++;
            } else if (l.startsWith('|') && /^\|?[\s:|-]+\|?$/.test(L[i + 1] || '')) {
                const cab = linhasTabela(l); i += 2;
                let h = '<table><thead><tr>' + cab.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
                while (i < L.length && L[i].startsWith('|')) { h += '<tr>' + linhasTabela(L[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>'; i++; }
                out.push(h + '</tbody></table>');
            } else if (/^(- |\d+\. )/.test(l)) {
                const ord = /^\d/.test(l), tag = ord ? 'ol' : 'ul', itens = [];
                while (i < L.length && /^(- |\d+\. )/.test(L[i])) { itens.push('<li>' + inline(L[i].replace(/^(- |\d+\. )/, '')) + '</li>'); i++; }
                out.push(`<${tag}>${itens.join('')}</${tag}>`);
            } else if (l.trim() === '') { i++; }
            else {
                const p = [];
                while (i < L.length && L[i].trim() !== '' && !/^(```|#{1,3} |\||- |\d+\. )/.test(L[i])) p.push(L[i++]);
                out.push('<p>' + inline(p.join(' ')) + '</p>');
            }
        }
        return out.join('\n');
    }

    fetch('/api/manual').then(r => {
        if (r.status === 401) { location.href = '/login'; throw new Error('401'); }
        if (!r.ok) throw new Error('Falha ao carregar o manual (' + r.status + ').');
        return r.text();
    }).then(t => {
        document.getElementById('conteudo').innerHTML = render(t);
        document.getElementById('msg').remove();
    }).catch(e => { if (e.message !== '401') document.getElementById('msg').textContent = e.message; });
})();
</script>
</body>
</html>
