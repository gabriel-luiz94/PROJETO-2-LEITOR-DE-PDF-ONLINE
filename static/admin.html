<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Gerenciar Usuários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
        }
        .glass {
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid rgba(48, 54, 61, 0.8);
            backdrop-filter: blur(10px);
        }
        .btn-primary {
            background-color: #d97706;
            color: #161b22;
        }
        .btn-primary:hover {
            background-color: #b45309;
        }
    </style>
</head>
<body class="bg-[#0d1117] h-screen p-8">
    <div class="max-w-4xl mx-auto glass rounded-xl p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-[#30363d] pb-4">
            <h1 class="text-2xl font-bold text-[#e6edf3]">Painel Administrativo</h1>
            <a href="/" class="text-sm text-[#8b949e] hover:text-white transition-colors">Voltar ao Início</a>
        </div>

        <div id="errorMsg" class="hidden bg-red-900 text-red-100 p-3 rounded-md mb-6"></div>
        <div id="successMsg" class="hidden bg-green-900 text-green-100 p-3 rounded-md mb-6"></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Formulário Novo Usuário -->
            <div class="md:col-span-1 border-r border-[#30363d] pr-6">
                <h2 class="text-xl font-semibold mb-4">Adicionar Usuário</h2>
                <form id="addUserForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-[#c9d1d9]">Email</label>
                        <input type="email" id="newEmail" required class="mt-1 block w-full px-3 py-2 border border-[#30363d] bg-[#0d1117] text-white rounded-md focus:ring-[#d97706] focus:border-[#d97706]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-[#c9d1d9]">Senha (mínimo 6)</label>
                        <input type="password" id="newPassword" required minlength="6" class="mt-1 block w-full px-3 py-2 border border-[#30363d] bg-[#0d1117] text-white rounded-md focus:ring-[#d97706] focus:border-[#d97706]">
                    </div>
                    <div class="flex items-center mt-4">
                        <input type="checkbox" id="newIsAdmin" class="h-4 w-4 text-[#d97706] border-[#30363d] rounded bg-[#0d1117]">
                        <label for="newIsAdmin" class="ml-2 block text-sm text-[#c9d1d9]">Tornar Admin</label>
                    </div>
                    <button type="submit" class="w-full btn-primary font-medium py-2 px-4 rounded-md shadow-sm transition-colors mt-6">
                        Criar Usuário
                    </button>
                </form>
            </div>

            <!-- Lista de Usuários -->
            <div class="md:col-span-2">
                <h2 class="text-xl font-semibold mb-4">Usuários Locais Cadastrados</h2>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm whitespace-nowrap">
                        <thead class="uppercase tracking-wider border-b border-[#30363d]">
                            <tr>
                                <th scope="col" class="px-6 py-3">E-mail</th>
                                <th scope="col" class="px-6 py-3">Tipo</th>
                                <th scope="col" class="px-6 py-3 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody" class="divide-y divide-[#30363d]">
                            <!-- Populado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
