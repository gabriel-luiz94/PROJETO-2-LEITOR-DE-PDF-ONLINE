<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Orçamento - Leitor Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/static/auth_fetch.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { display: flex; justify-content: flex-start; }
        .container { max-width: 100%; width: 100%; padding: 24px 32px 50px; }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding: 16px 22px;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .report-title { font-size: 1.6rem; font-weight: 700; color: #fff; margin: 0; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn-primary-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: linear-gradient(135deg, #d97706, #b45309);
            border: none;
            border-radius: 9px;
            color: white;
            padding: 9px 18px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(217,119,6,0.2);
        }
        .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217,119,6,0.35); }

        .btn-success-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: linear-gradient(135deg, #238636, #2ea043);
            border: none;
            border-radius: 9px;
            color: white;
            padding: 9px 18px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(46,160,67,0.2);
        }
        .btn-success-custom:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(46,160,67,0.35); }

        .btn-master-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: linear-gradient(135deg, #8957e5, #6d28d9);
            border: none;
            border-radius: 9px;
            color: white;
            padding: 9px 18px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(137,87,229,0.2);
        }
        .btn-master-custom:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(137,87,229,0.35); }

        .report-section {
            background: rgba(22, 27, 34, 0.65);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table thead th {
            background: rgba(31, 111, 235, 0.15);
            border-bottom: 1px solid rgba(217,119,6,0.3);
            color: #d97706;
            font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            padding: 10px 12px;
            position: sticky; top: 0; z-index: 10;
        }
        .data-table tbody tr { border-bottom: 1px solid rgba(48,54,61,0.5); transition: background 0.15s; }
        .data-table tbody tr:hover { background: rgba(217,119,6,0.06); }
        .data-table tbody td { padding: 8px 12px; font-size: 0.82rem; color: #c9d1d9; }

        .col-filter {
            width: 100%;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(48,54,61,0.8);
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 0.7rem;
            color: #c9d1d9;
            margin-top: 5px;
            outline: none;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        .col-filter:focus { border-color: #d97706; }

        .table-scroll { max-height: calc(100vh - 180px); overflow-y: auto; }

        #toast {
            position: fixed; bottom: 20px; right: 20px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white; padding: 12px 20px;
            border-radius: 10px; font-weight: 600; font-size: 0.85rem;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(46,160,67,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-header">
            <h1 class="report-title">Base de Orçamento</h1>
            <div class="header-actions">
                <button class="btn-primary-custom" style="background: #30363d; color: #c9d1d9;" onclick="window.location.href='/'">
                    Voltar
                </button>
                <input type="file" id="file-upload" accept=".csv" style="display: none;">
                <input type="file" id="file-upload-master" accept=".csv" style="display: none;">
                
                <button class="btn-primary-custom" onclick="adicionarLinha()" title="Adiciona na sua tabela local">
                    Adicionar Linha
                </button>
                <button id="btn-admin-add" class="btn-master-custom hidden" onclick="adicionarLinhaMaster()" title="Adiciona para TODOS os usuários (Nuvem)">
                    Nova Linha Master
                </button>
                <button class="btn-success-custom" onclick="salvarAlteracoes()" title="Salva alterações na sua tabela local">
                    Salvar Alterações
                </button>
                <button class="btn-primary-custom" onclick="document.getElementById('file-upload').click()" title="Sobrescreve a sua tabela local">
                    Importar CSV Local
                </button>
                <button id="btn-admin-csv" class="btn-master-custom hidden" onclick="document.getElementById('file-upload-master').click()" title="Sobrescreve a tabela mestre de TODOS os usuários">
                    Importar CSV Master
                </button>
            </div>
        </div>

        <div class="report-section">
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ATIVO<br><input type="text" class="col-filter" data-col="0" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>DESC ATIVO<br><input type="text" class="col-filter" data-col="1" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>COMPONENTE<br><input type="text" class="col-filter" data-col="2" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>PROJETO<br><input type="text" class="col-filter" data-col="3" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>MDO<br><input type="text" class="col-filter" data-col="4" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>CÓDIGO<br><input type="text" class="col-filter" data-col="5" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>DESC CÓDIGO<br><input type="text" class="col-filter" data-col="6" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>FATOR I<br><input type="text" class="col-filter" data-col="7" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>FATOR R<br><input type="text" class="col-filter" data-col="8" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th>FILTRO<br><input type="text" class="col-filter" data-col="9" placeholder="Filtro..." onkeyup="filterTable()"></th>
                            <th style="width: 40px; text-align: center;">AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody id="orcamento-tbody">
                        <tr><td colspan="11" style="text-align:center; padding:30px; color:#8b949e;">Nenhuma tabela base carregada. Clique em "Carregar CSV" para importar.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="quick-search" style="position: fixed; bottom: 80px; right: 20px; background: rgba(22, 27, 34, 0.95); border: 1px solid rgba(217,119,6,0.4); padding: 15px; border-radius: 12px; width: 340px; backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.5); z-index: 100;">
        <h4 style="margin:0 0 10px 0; color:#d97706; font-size:0.95rem;">Consulta Rápida (Ativo / Comp / Cód)</h4>
        <input type="text" id="qs-input" placeholder="Digite para buscar..." onkeyup="quickSearch()" style="width:100%; padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; margin-bottom: 10px; font-family: 'Inter', sans-serif;">
        <div id="qs-result" style="font-size: 0.8rem; color: #c9d1d9; max-height: 200px; overflow-y: auto;">
            <span style="color:#8b949e">Os resultados aparecerão aqui.</span>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const tbody = document.getElementById('orcamento-tbody');
        const fileInput = document.getElementById('file-upload');
        const toast = document.getElementById('toast');

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        const token = localStorage.getItem('auth_token');
        if (!token) {
            alert("Acesso restrito. Faça login como Administrador para gerenciar a base de orçamento.");
            window.location.href = '/login';
        }

        // Controle de Admin UI
        if (localStorage.getItem('is_admin') === 'true') {
            document.getElementById('btn-admin-add').classList.remove('hidden');
            document.getElementById('btn-admin-csv').classList.remove('hidden');
        }

        async function carregarDados() {
            try {
                const res = await fetch('/api/orcamento/dados');
                const data = await res.json();
                tbody.innerHTML = '';
                if (data.dados && data.dados.length > 0) {
                    data.dados.forEach(r => {
                        const tr = document.createElement('tr');
                        tr.innerHTML =
                            `<td><input type="text" class="cell-input" value="${r.ativo || ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.desc_ativo || ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.componente || ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.projeto || ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.mdo || ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.codigo || ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.desc_codigo || ''}"></td>` +
                            `<td><input type="number" step="0.01" class="cell-input" value="${r.fator_i !== null ? r.fator_i : ''}"></td>` +
                            `<td><input type="number" step="0.01" class="cell-input" value="${r.fator_r !== null ? r.fator_r : ''}"></td>` +
                            `<td><input type="text" class="cell-input" value="${r.filtro || ''}"></td>` +
                            '<td style="text-align:center; cursor:pointer;"><button class="btn-del" onclick="this.closest(\'tr\').remove()" title="Excluir">Excluir</button></td>';
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center; padding:30px; color:#8b949e;">Nenhuma tabela base carregada. Clique em "Carregar CSV" para importar.</td></tr>';
                }
            } catch(e) { console.error(e); }
        }

        // Call the function on page load
        carregarDados();

        document.getElementById('file-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload/csv-orcamento', { method: 'POST', body: formData });
                if (res.ok) {
                    showToast("CSV Local carregado com sucesso!");
                    carregarDados();
                }
            } catch (err) { console.error(err); }
        });

        document.getElementById('file-upload-master').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showToast("Fazendo upload para a Nuvem Master...");
            const formData = new FormData();
            formData.append('file', file);
            const token = localStorage.getItem('auth_token');

            try {
                const res = await fetch('/api/admin/upload-master', { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData 
                });
                
                if (res.ok) {
                    showToast("Tabela Mestre atualizada para TODOS!");
                    await fetch('/api/health/sync-master', {method: 'POST'});
                    carregarDados();
                } else {
                    showToast("Erro ao fazer upload Master.");
                }
            } catch (err) { 
                showToast("Erro de conexão."); 
            }
        });

        function adicionarLinha() {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="number" step="0.01" class="cell-input"></td>
                <td><input type="number" step="0.01" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><button class="btn-del" onclick="this.closest('tr').remove()">Excluir</button></td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);
        }

        function adicionarLinhaMaster() {
            const tr = document.createElement('tr');
            tr.style.backgroundColor = 'rgba(217,119,6, 0.1)';
            tr.innerHTML = `
                <td><input type="text" class="cell-input" placeholder="Novo Master"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><input type="number" step="0.01" class="cell-input"></td>
                <td><input type="number" step="0.01" class="cell-input"></td>
                <td><input type="text" class="cell-input"></td>
                <td><button class="btn-del" style="background:#d97706;" onclick="salvarLinhaMaster(this)">Salvar Nuvem</button></td>
            `;
            tbody.insertBefore(tr, tbody.firstChild);
        }

        async function salvarLinhaMaster(btn) {
            const tr = btn.closest('tr');
            const inputs = tr.querySelectorAll('.cell-input');
            const payload = {
                ativo: inputs[0].value,
                desc_ativo: inputs[1].value,
                componente: inputs[2].value,
                projeto: inputs[3].value,
                mdo: inputs[4].value,
                codigo: inputs[5].value,
                desc_codigo: inputs[6].value,
                fator_i: inputs[7].value ? parseFloat(inputs[7].value) : 0,
                fator_r: inputs[8].value ? parseFloat(inputs[8].value) : 0,
                filtro: inputs[9].value
            };

            const token = localStorage.getItem('auth_token');
            if (!token) {
                alert("Você precisa estar autenticado como Administrador.");
                window.location.href = '/login';
                return;
            }

            try {
                const res = await fetch('/api/admin/add-row', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.msg || "Linha Master salva com sucesso na nuvem!");
                    tr.style.backgroundColor = '';
                    btn.innerText = "Excluir";
                    btn.style.background = "";
                    btn.onclick = function() { tr.remove(); };
                } else {
                    const msg = data.detail || "Erro ao salvar Master.";
                    showToast(msg);
                    alert(msg);
                }
            } catch (err) {
                showToast("Erro de conexão.");
            }
        }

        async function salvarAlteracoes() {
            const trs = Array.from(tbody.querySelectorAll("tr"));
            const dados = trs.map(tr => {
                const inputs = tr.querySelectorAll('.cell-input');
                if (inputs.length < 10) return null;
                return {
                    ativo: inputs[0].value, desc_ativo: inputs[1].value, componente: inputs[2].value,
                    projeto: inputs[3].value, mdo: inputs[4].value, codigo: inputs[5].value,
                    desc_codigo: inputs[6].value, fator_i: inputs[7].value, fator_r: inputs[8].value, filtro: inputs[9].value
                };
            }).filter(d => d);
            
            const token = localStorage.getItem('auth_token');
            if (!token) {
                alert("Você precisa estar autenticado como Administrador.");
                window.location.href = '/login';
                return;
            }

            try {
                showToast("Salvando...");
                const res = await fetch('/api/orcamento/salvar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
                    body: JSON.stringify({ dados: dados })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast("Base atualizada!");
                } else {
                    const msg = data.detail || "Erro ao salvar.";
                    showToast(msg);
                    alert(msg);
                }
            } catch(e) { alert("Erro de conexão."); }
        }

        function filterTable() {
            const inputs = Array.from(document.querySelectorAll('.col-filter'));
            const filters = inputs.map(i => ({ col: parseInt(i.dataset.col), val: i.value.toLowerCase().trim() }));
            tbody.querySelectorAll('tr').forEach(tr => {
                let show = true;
                filters.forEach(f => {
                    const cell = tr.cells[f.col]?.querySelector('input');
                    if (f.val && cell && !cell.value.toLowerCase().includes(f.val)) show = false;
                });
                tr.style.display = show ? "" : "none";
            });
        }

        function quickSearch() {
            const query = document.getElementById('qs-input').value.toUpperCase().trim();
            const resDiv = document.getElementById('qs-result');
            if (!query) { resDiv.innerHTML = '<span style="color:#8b949e">Os resultados aparecerão aqui.</span>'; return; }
            
            let html = "";
            let matches = 0;
            tbody.querySelectorAll("tr").forEach(tr => {
                if (matches > 10) return;
                const inputs = tr.querySelectorAll(".cell-input");
                if (inputs[0].value.toUpperCase().includes(query) || inputs[2].value.toUpperCase().includes(query) || inputs[5].value.toUpperCase().includes(query)) {
                    html += `<div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 8px;">
                                <strong style="color:#d97706">CÓD: ${inputs[5].value || '-'}</strong> | Atv: ${inputs[0].value || '-'} | Comp: ${inputs[2].value || '-'}<br>
                                <span style="font-size: 0.75rem; color:#8b949e;">${inputs[6].value || '-'}</span>
                             </div>`;
                    matches++;
                }
            });
            if (matches === 0) {
                resDiv.innerHTML = '<span style="color:#ff7b72">Nenhum resultado encontrado.</span>';
            } else {
                resDiv.innerHTML = html;
            }
        }

        // ---- Suporte a Colar Múltiplas Células (Excel) ----
        tbody.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.originalEvent || e).clipboardData.getData('text/plain');
            if (!text) return;
            
            const rows = text.split(/\r\n|\n|\r/);
            let currentCell = document.activeElement;
            if (currentCell.tagName !== 'TD') return;

            let tr = currentCell.parentElement;
            let startColIndex = Array.from(tr.children).indexOf(currentCell);

            for (let i = 0; i < rows.length; i++) {
                if (!rows[i] && i === rows.length - 1) continue; // ignora linha em branco no final
                const cols = rows[i].split('\t');
                
                if (!tr) {
                    adicionarLinha(false);
                    tr = tbody.lastElementChild;
                }
                
                for (let j = 0; j < cols.length; j++) {
                    const cellIndex = startColIndex + j;
                    if (cellIndex < tr.cells.length - 1) { // não sobrescreve a coluna de exclusão
                        tr.cells[cellIndex].innerText = cols[j].trim();
                    }
                }
                
                tr = tr.nextElementSibling;
            }
        });
    </script>
</body>
</html>
