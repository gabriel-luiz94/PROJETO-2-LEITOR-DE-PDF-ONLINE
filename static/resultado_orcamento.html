<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado do Orçamento - Leitor Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { display: flex; justify-content: flex-start; }
        .container { max-width: 100%; width: 100%; padding: 24px 32px 50px; }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding: 16px 22px;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }
        .report-title { font-size: 1.6rem; font-weight: 700; color: #fff; margin: 0; }
        .header-actions { display: flex; gap: 10px; align-items: center; }

        .btn-print {
            display: flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #b45309, #8957e5);
            border: none;
            border-radius: 9px;
            color: white;
            padding: 9px 18px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(217,119,6,0.2);
        }
        .btn-print:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217,119,6,0.35); }

        .btn-primary-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: linear-gradient(135deg, #d97706, #b45309);
            border: none;
            border-radius: 9px;
            color: white;
            padding: 9px 18px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(217,119,6,0.2);
        }
        .btn-primary-custom:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217,119,6,0.35); }

        .btn-success-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            background: linear-gradient(135deg, #238636, #2ea043);
            border: none;
            border-radius: 9px;
            color: white;
            padding: 9px 18px;
            font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.22s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 15px rgba(46,160,67,0.2);
        }
        .btn-success-custom:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(46,160,67,0.35); }

        .status-bar {
            margin-bottom: 14px;
            padding: 10px 16px;
            background: rgba(22, 27, 34, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 10px;
            font-size: 0.78rem;
            font-family: 'Inter', monospace;
            color: #8b949e;
        }

        .report-section {
            background: rgba(22, 27, 34, 0.65);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table thead th {
            background: rgba(35, 134, 54, 0.15);
            border-bottom: 1px solid rgba(63,185,80,0.3);
            color: #3fb950;
            font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            padding: 10px 12px;
            position: sticky; top: 0; z-index: 10;
        }
        .data-table tbody tr { border-bottom: 1px solid rgba(48,54,61,0.5); transition: background 0.15s; }
        .data-table tbody tr:hover { background: rgba(63,185,80,0.05); }
        .data-table tbody td { padding: 9px 12px; font-size: 0.83rem; color: #c9d1d9; }

        /* Badge de operação */
        .badge-op {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.72rem; font-weight: 700;
            letter-spacing: 0.06em;
        }
        .badge-i { background: rgba(180,83,9,0.2); color: #d97706; border: 1px solid rgba(217,119,6,0.35); }
        .badge-r { background: rgba(255,123,114,0.15); color: #ff7b72; border: 1px solid rgba(255,123,114,0.35); }

        .table-scroll { max-height: calc(100vh - 230px); overflow-y: auto; }

        .qty-cell { font-weight: 600; color: #e3b341; text-align: right; }

        @media print {
            .report-header button, .status-bar { display: none; }
            body { background: white; color: black; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-header">
            <h1 class="report-title">💰 Resultado do Orçamento</h1>
            <div class="header-actions">
                <input type="text" id="obra-numero" placeholder="Nº da obra" class="action-input" style="width:120px; padding: 8px; border-radius: 6px;">
                <select id="obra-uf" class="action-input" style="padding: 8px; border-radius: 6px;">
                    <option value="RONDONIA">RONDÔNIA</option>
                    <option value="PARAIBA">PARAÍBA</option>
                </select>
                <input type="file" id="file-rec-externo" accept=".rec, .json" style="display: none;" onchange="importarRecExterno(event, 'somar')">
                <input type="file" id="file-rec-subtrair" accept=".rec, .json" style="display: none;" onchange="importarRecExterno(event, 'subtrair')">
                
                <button class="btn-success-custom" onclick="salvarRecBanco()">💾 Salvar Banco (REC)</button>
                <button class="btn-success-custom" onclick="baixarRecExterno()">⬇️ Baixar .rec Externo</button>
                
                <button class="btn-primary-custom" onclick="document.getElementById('file-rec-externo').click()">📥 Somar REC Externo</button>
                
                <button class="btn-primary-custom" onclick="document.getElementById('file-rec-subtrair').click()">📤 Subtrair REC Externo</button>
                
                <button class="btn-primary-custom" onclick="abrirModalRecs()">🗄️ Somar REC do Banco</button>
                <button class="btn-success-custom" onclick="abrirModalImportarPdfs()">📄 Importar REC via PDFs</button>
                <button class="btn-primary-custom" onclick="adicionarLinhaManual()">➕ Adicionar Linha</button>
                <button class="btn-primary-custom" onclick="limparTabela()">🗑 Limpar Tabela</button>

                
                <div style="width:1px; height:30px; background:rgba(255,255,255,0.2); margin:0 5px;"></div>
                <input type="text" id="searchInput" placeholder="Busca Geral..." onkeyup="applyAllFilters()" style="padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; width: 120px;">
                <button class="btn-print" onclick="window.print()">🖨</button>
                <button class="btn-print" onclick="copiarTudo()">📋</button>
            </div>
        </div>

        <!-- Modal RECs Salvos -->
        <div id="modal-recs" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center;">
            <div style="background: #161b22; padding: 24px; border-radius: 12px; width: 600px; max-width: 90%; border: 1px solid #30363d; color: white;">
                <h2 style="margin-top:0;">📂 RECs Salvos no Banco</h2>
                <input type="text" id="search-recs" placeholder="Buscar por número..." onkeyup="filtrarModalRecs()" style="width: 100%; padding: 8px; margin-bottom: 12px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px;">
                <div style="max-height: 300px; overflow-y: auto;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="text-align: left; border-bottom: 1px solid #30363d;">
                                <th style="padding: 8px;">Nº da Obra</th>
                                <th style="padding: 8px;">Data</th>
                                <th style="padding: 8px; text-align: right;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-recs-salvos">
                        </tbody>
                    </table>
                </div>
                <div style="text-align: right; margin-top: 16px;">
                    <button onclick="document.getElementById('modal-recs').style.display='none'" class="btn-primary-custom" style="background: #30363d;">Fechar</button>
                </div>
            </div>
        </div>

        <!-- Modal Importar PDFs -->
        <div id="modal-importar-pdfs" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center;">
            <div style="background: #161b22; padding: 24px; border-radius: 12px; width: 450px; max-width: 90%; border: 1px solid #30363d; color: white;">
                <h2 style="margin-top:0;">📄 Importar Orçamento e Lista</h2>
                <p style="font-size: 0.9rem; color: #8b949e; margin-bottom: 20px;">
                    Selecione os PDFs de Orçamento e Lista para mesclar automaticamente na tabela.
                </p>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #c9d1d9;">PDF do Orçamento:</label>
                    <input type="file" id="file-pdf-orcamento" accept=".pdf" style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #c9d1d9;">PDF da Lista de Materiais:</label>
                    <input type="file" id="file-pdf-lista" accept=".pdf" style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px;">
                </div>
                <div style="text-align: right; margin-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
                    <button onclick="document.getElementById('modal-importar-pdfs').style.display='none'" class="btn-primary-custom" style="background: #30363d;">Cancelar</button>
                    <button onclick="importarPdfs()" class="btn-primary-custom" id="btn-importar-pdfs">Importar e Mesclar</button>
                </div>
            </div>
        </div>


        <div class="status-bar" id="status-msg">Carregando dados...</div>

        <div class="report-section">
            <div class="table-scroll">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable(0)" style="cursor: pointer;" title="Clique para ordenar">OPERAÇÃO ↕</th>
                            <th onclick="sortTable(1)" style="cursor: pointer;" title="Clique para ordenar">TIPO MDO ↕</th>
                            <th onclick="sortTable(2)" style="cursor: pointer;" title="Clique para ordenar">CÓDIGO ↕</th>
                            <th onclick="sortTable(3)" style="cursor: pointer;" title="Clique para ordenar">DESCRIÇÃO ↕</th>
                            <th onclick="sortTable(4)" style="cursor: pointer; text-align:right;" title="Clique para ordenar">QUANTIDADE ↕</th>
                            <th style="text-align:center; width: 60px;">AÇÃO</th>
                        </tr>
                        <tr class="filters-row">
                            <th><input type="text" onkeyup="applyAllFilters()" placeholder="Filtrar..." style="width:100%; padding:4px; font-size:12px; background:#0d1117; color:white; border:1px solid #30363d; border-radius:4px;"></th>
                            <th><input type="text" onkeyup="applyAllFilters()" placeholder="Filtrar..." style="width:100%; padding:4px; font-size:12px; background:#0d1117; color:white; border:1px solid #30363d; border-radius:4px;"></th>
                            <th><input type="text" onkeyup="applyAllFilters()" placeholder="Filtrar..." style="width:100%; padding:4px; font-size:12px; background:#0d1117; color:white; border:1px solid #30363d; border-radius:4px;"></th>
                            <th><input type="text" onkeyup="applyAllFilters()" placeholder="Filtrar..." style="width:100%; padding:4px; font-size:12px; background:#0d1117; color:white; border:1px solid #30363d; border-radius:4px;"></th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="resultado-orcamento-tbody">
                        <tr><td colspan="6" style="text-align:center; padding:30px; color:#8b949e;">Calculando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const tbody = document.getElementById('resultado-orcamento-tbody');
        const statusMsg = document.getElementById('status-msg');

        function log(msg) {
            console.log(msg);
            statusMsg.textContent = msg;
        }

        function getRowsData() {
            const trs = Array.from(tbody.querySelectorAll("tr"));
            let data = [];
            trs.forEach(tr => {
                if (tr.innerText.includes("Calculando") || tr.innerText.includes("Nenhum código encontrado")) return;
                const op = tr.cells[0].innerText.trim();
                const mdo = tr.cells[1].innerText.trim();
                const codigo = tr.cells[2].innerText.trim();
                const desc = tr.cells[3].innerText.trim();
                const qtdStr = tr.cells[4].innerText.trim().replace(',', '.');
                const qtd = parseFloat(qtdStr) || 0;
                if(codigo || desc) {
                    data.push({ operacao: op, mdo: mdo, codigo: codigo, desc_codigo: desc, total: parseFloat(qtd.toFixed(2)) });
                }
            });
            return data;
        }

        function renderRowsData(data) {
            tbody.innerHTML = '';
            data.forEach(item => {
                const badgeClass = item.operacao === 'I' ? 'badge-i' : 'badge-r';
                const tr = document.createElement('tr');
                tr.innerHTML =
                    '<td contenteditable="true"><span class="badge-op ' + badgeClass + '" contenteditable="false">' + (item.operacao || 'I') + '</span></td>' +
                    '<td contenteditable="true">' + (item.mdo || 'MÃO-DE-OBRA') + '</td>' +
                    '<td contenteditable="true">' + (item.codigo || '') + '</td>' +
                    '<td contenteditable="true">' + (item.desc_codigo || '') + '</td>' +
                    '<td contenteditable="true" class="qty-cell">' + (item.total || 0).toFixed(2).replace('.', ',') + '</td>' +
                    '<td style="text-align:center;"><button onclick="this.closest(\'tr\').remove()" style="background:transparent; border:none; color:#f85149; cursor:pointer; font-size: 1rem;" title="Excluir Linha">✖</button></td>';
                tbody.appendChild(tr);
            });
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#8b949e;">Nenhum item.</td></tr>';
            }
        }

        function consolidateData(data) {
            let map = {};
            data.forEach(item => {
                let key = `${item.operacao}|${item.mdo}|${item.codigo}`;
                if (map[key]) {
                    map[key].total = parseFloat((map[key].total + item.total).toFixed(2));
                } else {
                    map[key] = { ...item };
                    map[key].total = parseFloat(item.total.toFixed(2));
                }
            });
            return Object.values(map);
        }

        function adicionarLinhaManual() {
            let data = getRowsData();
            data.push({ operacao: 'I', mdo: 'MATERIAL', codigo: 'NOVO_COD', desc_codigo: 'Nova Descrição', total: 1 });
            renderRowsData(data);
        }

        async function montarOrcamento() {
            try {
                log('Lendo payload do localStorage...');
                const payloadStr = localStorage.getItem('orcamentoPayload');
                if (!payloadStr) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:30px; color:#f85149;">Nenhum payload encontrado. Volte na tela de Resumo e clique em "Montar Orçamento" novamente.</td></tr>';
                    log('ERRO: orcamentoPayload não encontrado no localStorage');
                    return;
                }

                const payload = JSON.parse(payloadStr);
                log('Payload OK — Cabos: ' + (payload.cabos ? payload.cabos.length : 0) + ', Outros: ' + (payload.outros ? payload.outros.length : 0) + '. Chamando API...');

                const res = await fetch('/api/orcamento/calcular', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                log('Resposta da API: HTTP ' + res.status);
                const data = await res.json();

                if (res.ok) {
                    tbody.innerHTML = '';
                    
                    if (data.nao_encontrados && data.nao_encontrados.length > 0) {
                        const notFoundAlert = document.createElement('div');
                        notFoundAlert.style = "background: rgba(210, 153, 34, 0.15); border: 1px solid rgba(210, 153, 34, 0.4); color: #d29922; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; font-size: 0.85rem;";
                        notFoundAlert.innerHTML = `⚠️ <b>Atenção:</b> Os seguintes itens ou códigos não foram encontrados no banco e foram ignorados: <b>${data.nao_encontrados.join(', ')}</b>`;
                        document.querySelector('.report-section').insertAdjacentElement('beforebegin', notFoundAlert);
                    }

                    if (data.resultado && data.resultado.length > 0) {
                        log('Sucesso! ' + data.resultado.length + ' linha(s) encontrada(s).');
                        renderRowsData(data.resultado);
                    } else {
                        log('API OK, resultado vazio — verifique se os ativos da tabela batem com a base de orçamento carregada.');
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#8b949e;">Nenhum código encontrado. Verifique se a tabela de orçamento foi carregada em "Tabela Orçamento".</td></tr>';
                    }
                } else {
                    log('ERRO da API: ' + JSON.stringify(data));
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#f85149;">Erro do servidor: ' + (data.detail || data.error || JSON.stringify(data)) + '</td></tr>';
                }
            } catch(e) {
                log('EXCEÇÃO: ' + e.message);
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#f85149;">Erro: ' + e.message + '</td></tr>';
            }
        }

        montarOrcamento();

        // Funcionalidade de Filtro
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const trs = tbody.getElementsByTagName("tr");
            for (let i = 0; i < trs.length; i++) {
                const tds = trs[i].getElementsByTagName("td");
                let match = false;
                for (let j = 0; j < tds.length; j++) {
                    if (tds[j] && tds[j].innerText.toUpperCase().indexOf(filter) > -1) {
                        match = true; break;
                    }
                }
                trs[i].style.display = match ? "" : "none";
            }
        }

        // Funcionalidade de Ordenação
        let sortDirections = [true, true, true, true, true]; // true = asc, false = desc
        function sortTable(columnIndex) {
            const trs = Array.from(tbody.querySelectorAll("tr"));
            if (trs.length <= 1) return; // ignore se for 'Calculando...'

            const isAsc = sortDirections[columnIndex];
            sortDirections[columnIndex] = !isAsc;

            trs.sort((a, b) => {
                let textA = a.cells[columnIndex].innerText.trim();
                let textB = b.cells[columnIndex].innerText.trim();

                // Tratamento especial para quantidade (numérico)
                if (columnIndex === 4) {
                    let numA = parseFloat(textA.replace(',', '.')) || 0;
                    let numB = parseFloat(textB.replace(',', '.')) || 0;
                    return isAsc ? numA - numB : numB - numA;
                }

                return isAsc ? textA.localeCompare(textB) : textB.localeCompare(textA);
            });

            tbody.innerHTML = "";
            trs.forEach(tr => tbody.appendChild(tr));
        }

        // Botão de Copiar Tabela
        function copiarTudo() {
            const trs = Array.from(tbody.querySelectorAll("tr"));
            if (trs.length === 0 || (trs.length === 1 && trs[0].innerText.includes("Calculando"))) return;
            
            let tsv = "";
            trs.forEach(tr => {
                if (tr.style.display === "none") return;
                const rowData = Array.from(tr.cells).map(td => td.innerText.trim()).join("\t");
                tsv += rowData + "\n";
            });
            
            navigator.clipboard.writeText(tsv).then(() => {
                alert("Tabela copiada para a área de transferência com sucesso!");
            }).catch(err => {
                console.error("Erro ao copiar: ", err);
                alert("Erro ao copiar a tabela.");
            });
        }

        function gerarConteudoRec() {
            const trs = Array.from(tbody.querySelectorAll("tr"));
            if (trs.length === 0 || (trs.length === 1 && trs[0].innerText.includes("Calculando"))) {
                return null;
            }
            let recLines = [];
            trs.forEach(tr => {
                if (tr.style.display === "none") return;
                const op = tr.cells[0].innerText.trim();
                const mdo = tr.cells[1].innerText.trim().toUpperCase();
                const codigo = tr.cells[2].innerText.trim();
                const qtd = tr.cells[4].innerText.trim();
                
                const mdoCode = (mdo === "MATERIAL") ? "M" : "S";
                const opCode = (op === "I") ? "IN" : "DR"; 
                const odiCode = (op === "I") ? "ODI" : "ODD";
                
                const line = `${codigo};${qtd};${mdoCode};${opCode};${odiCode};LM`;
                recLines.push(line);
            });
            return recLines.join("\r\n");
        }

        async function salvarRecBanco() {
            const numObra = document.getElementById("obra-numero").value.trim();
            if (!numObra) {
                alert("Digite o Número da obra para salvar no banco.");
                return;
            }
            const conteudo = gerarConteudoRec();
            if (!conteudo) return alert("Não há dados para salvar.");

            try {
                const res = await fetch('/api/recs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ numero_obra: numObra, dados_json: conteudo })
                });
                if (res.ok) log(`✔️ Obra Nº ${numObra} salva no banco com sucesso!`);
            } catch(e) {
                alert("Erro ao salvar.");
            }
        }

        async function baixarRecExterno() {
            const numObra = document.getElementById("obra-numero").value.trim() || "EXPORT";
            const estado = document.getElementById("obra-uf").value;
            const conteudo = gerarConteudoRec();
            if (!conteudo) return alert("Não há dados para baixar.");

            let prefix = estado === "RONDONIA" ? "229" : "027";
            const filename = `${prefix}_${numObra}_ODI.rec`;

            try {
                if (window.showSaveFilePicker) {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{
                            description: 'Arquivo REC',
                            accept: {'text/plain': ['.rec']},
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(conteudo);
                    await writable.close();
                    log(`✔️ Arquivo salvo com sucesso!`);
                } else {
                    // Fallback
                    const blob = new Blob([conteudo], { type: "text/plain" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    log(`✔️ Download iniciado!`);
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert("Erro ao salvar arquivo.");
                }
            }
        }

        async function parseRecAndRender(conteudoTexto, isSubtrair = false) {
            const lines = conteudoTexto.split(/\r?\n/);
            
            // Remove the 'Calculando...' row if present
            const firstRow = tbody.querySelector("tr");
            if(firstRow && (firstRow.innerText.includes("Calculando...") || firstRow.innerText.includes("Tabela vazia"))) {
                tbody.innerHTML = '';
            }

            let count = 0;
            let itemsToFetch = [];
            
            lines.forEach(line => {
                if(!line.trim()) return;
                const parts = line.split(';');
                if (parts.length < 6) return;
                const codigo = parts[0];
                const qtd = parseFloat(parts[1].replace(',','.')) || 0;
                const mdoCode = parts[2];
                const opCode = parts[3];
                
                const operacao = opCode === 'IN' ? 'I' : 'R';
                const mdo = mdoCode === 'S' ? 'MÃO-DE-OBRA' : 'MATERIAL';
                
                itemsToFetch.push({ codigo, operacao, mdo, qtd: isSubtrair ? -qtd : qtd });
            });

            if(itemsToFetch.length === 0) {
                alert("Arquivo REC vazio ou inválido.");
                return;
            }

            // Fetch details
            let descricoes = {};
            try {
                const codigosUnicos = [...new Set(itemsToFetch.map(i => i.codigo))];
                const res = await fetch('/api/orcamento/detalhes', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ codigos: codigosUnicos })
                });
                if(res.ok) descricoes = await res.json();
            } catch(e) {
                console.error("Erro ao buscar detalhes:", e);
            }

            let newItemData = itemsToFetch.map(item => {
                const desc = descricoes[item.codigo] ? descricoes[item.codigo].desc_codigo : "Descrição indisponível";
                return {
                    operacao: item.operacao,
                    mdo: item.mdo,
                    codigo: item.codigo,
                    desc_codigo: desc,
                    total: item.qtd
                };
            });

            let currentData = getRowsData();
            let combinedData = currentData.concat(newItemData);
            let finalData = consolidateData(combinedData);
            
            renderRowsData(finalData);

            log(`${isSubtrair ? '-' : '+'}${itemsToFetch.length} itens importados e consolidados do REC!`);
        }

        function carregarRecExterno(event, isSubtrair = false) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                parseRecAndRender(e.target.result, isSubtrair);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        async function abrirModalRecs() {
            document.getElementById('modal-recs').style.display = 'flex';
            const tbodyModal = document.getElementById('tbody-recs-salvos');
            tbodyModal.innerHTML = '<tr><td colspan="3">Carregando...</td></tr>';
            try {
                const res = await fetch('/api/recs');
                const recs = await res.json();
                tbodyModal.innerHTML = '';
                recs.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
                    tr.innerHTML = `
                        <td style="padding:8px;">${r.numero_obra}</td>
                        <td style="padding:8px;">${r.data_criacao}</td>
                        <td style="padding:8px; text-align:right;">
                            <button onclick="carregarRecBanco('${r.numero_obra}', false)" style="background:#238636; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-right:4px;">Somar</button>
                            <button onclick="carregarRecBanco('${r.numero_obra}', true)" style="background:#d73a49; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-right:4px;">Subtrair</button>
                            <button onclick="excluirRecBanco('${r.numero_obra}')" style="background:#da3633; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Excluir</button>
                        </td>
                    `;
                    tbodyModal.appendChild(tr);
                });
            } catch(e) {
                tbodyModal.innerHTML = '<tr><td colspan="3">Erro ao carregar RECs.</td></tr>';
            }
        }

        async function carregarRecBanco(numObra, isSubtrair = false) {
            document.getElementById('modal-recs').style.display = 'none';
            if(!isSubtrair) document.getElementById('obra-numero').value = numObra;
            try {
                const res = await fetch(`/api/recs/${numObra}`);
                const data = await res.json();
                parseRecAndRender(data.dados_json, isSubtrair);
            } catch(e) {
                alert("Erro ao carregar do banco.");
            }
        }

        async function excluirRecBanco(numObra) {
            if(!confirm(`Deseja excluir a obra ${numObra}?`)) return;
            try {
                await fetch(`/api/recs/${numObra}`, { method: 'DELETE' });
                abrirModalRecs(); // Atualiza
            } catch(e) {
                alert("Erro ao excluir.");
            }
        }

        function applyAllFilters() {
            const globalFilter = document.getElementById("searchInput").value.toUpperCase();
            const colInputs = document.querySelectorAll('.filters-row input');
            const trs = tbody.getElementsByTagName("tr");
            
            for (let i = 0; i < trs.length; i++) {
                if (trs[i].cells.length < 6) continue;
                
                let show = true;
                
                // Filtro Global
                if (globalFilter && trs[i].innerText.toUpperCase().indexOf(globalFilter) === -1) {
                    show = false;
                }
                
                // Filtro por Coluna
                if (show) {
                    for(let c = 0; c < 4; c++) {
                        const colFilter = colInputs[c].value.toUpperCase();
                        if(colFilter && trs[i].cells[c].innerText.toUpperCase().indexOf(colFilter) === -1) {
                            show = false;
                            break;
                        }
                    }
                }
                
                trs[i].style.display = show ? "" : "none";
            }
        }
        
        function limparTabela() {
            if(confirm("Tem certeza que deseja limpar toda a tabela?")) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:#8b949e;">Tabela vazia.</td></tr>';
            }
        }

        function filtrarModalRecs() {
            const filter = document.getElementById("search-recs").value.toUpperCase();
            const trs = document.getElementById('tbody-recs-salvos').getElementsByTagName('tr');
            for (let i = 0; i < trs.length; i++) {
                trs[i].style.display = trs[i].innerText.toUpperCase().indexOf(filter) > -1 ? "" : "none";
            }
        }

        function abrirModalImportarPdfs() {
            document.getElementById('modal-importar-pdfs').style.display = 'flex';
            document.getElementById('file-pdf-orcamento').value = '';
            document.getElementById('file-pdf-lista').value = '';
        }

        async function importarPdfs() {
            const fileOrc = document.getElementById('file-pdf-orcamento').files[0];
            const fileList = document.getElementById('file-pdf-lista').files[0];
            
            if (!fileOrc || !fileList) {
                alert("Por favor, selecione ambos os arquivos PDF (Orçamento e Lista).");
                return;
            }

            const btn = document.getElementById('btn-importar-pdfs');
            const originalText = btn.innerText;
            btn.innerText = "Processando...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append("orcamento", fileOrc);
            formData.append("lista", fileList);

            try {
                const res = await fetch('/api/importar-rec-pdf', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (res.ok && data.resultado) {
                    const newItemData = data.resultado;
                    
                    if(newItemData.length === 0) {
                        alert("Nenhum dado válido extraído dos PDFs.");
                    } else {
                        // Removendo linha de calculando, caso exista
                        const firstRow = tbody.querySelector("tr");
                        if(firstRow && firstRow.innerText.includes("Calculando...")) {
                            tbody.innerHTML = '';
                        }
                        
                        let currentData = getRowsData();
                        let combinedData = currentData.concat(newItemData);
                        let finalData = consolidateData(combinedData);
                        
                        renderRowsData(finalData);
                        log(`+${newItemData.length} itens extraídos dos PDFs e mesclados!`);
                        
                        document.getElementById('modal-importar-pdfs').style.display = 'none';
                    }
                } else {
                    alert("Erro ao extrair PDFs: " + (data.error || "Desconhecido"));
                }
            } catch(e) {
                alert("Erro ao conectar no servidor.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // Suporte para Ctrl+C limpo (remover contenteditable antes da cópia para não vir o HTML sujo, se necessário)
        document.addEventListener('copy', (e) => {
            const selection = window.getSelection();
            if (!selection.isCollapsed && document.activeElement.tagName !== 'INPUT') {
                // Deixa o navegador fazer o copy nativo da seleção.
            }
        });

        // Suporte para COLAR dados tabulares (Excel/Sheets)
        document.addEventListener('paste', async (e) => {
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;

            const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
            
            // Se contiver tabulações, tratamos como uma tabela copiada
            if (lines.length > 0 && lines[0].includes('\t')) {
                // Se o usuário estiver editando ativamente uma célula, vamos evitar sobrescrever tudo?
                // O ideal é assumir a importação em massa se for tabela.
                e.preventDefault(); 
                
                let itemsToFetch = [];
                lines.forEach(line => {
                    const parts = line.split('\t').map(p => p.trim());
                    if (parts.length >= 3) { // Precisa ter pelo menos OP, MDO e CÓDIGO
                        let operacao = parts[0].toUpperCase() === 'R' ? 'R' : 'I';
                        let mdo = (parts[1] && parts[1].toUpperCase().includes('MATERIAL')) ? 'MATERIAL' : 'MÃO-DE-OBRA';
                        let codigo = parts[2] || '';
                        let pastedDesc = parts[3] || '';
                        let qtdStr = parts[4] || '1';
                        
                        let qtd = parseFloat(qtdStr.replace(',', '.')) || 1;
                        if (codigo) {
                            itemsToFetch.push({ operacao, mdo, codigo, pastedDesc, qtd });
                        }
                    }
                });

                if (itemsToFetch.length > 0) {
                    log(`Analisando ${itemsToFetch.length} itens colados...`);
                    
                    let descricoes = {};
                    try {
                        const codigosUnicos = [...new Set(itemsToFetch.map(i => i.codigo))];
                        const res = await fetch('/api/orcamento/detalhes', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ codigos: codigosUnicos })
                        });
                        if(res.ok) descricoes = await res.json();
                    } catch(err) {
                        console.error("Erro ao buscar detalhes do paste:", err);
                    }

                    let newItemData = itemsToFetch.map(item => {
                        let finalDesc = item.pastedDesc;
                        if (descricoes[item.codigo]) {
                            finalDesc = descricoes[item.codigo].desc_codigo;
                        } else {
                            finalDesc = "não encontrado na descrição";
                        }
                        
                        return {
                            operacao: item.operacao,
                            mdo: item.mdo,
                            codigo: item.codigo,
                            desc_codigo: finalDesc,
                            total: item.qtd
                        };
                    });

                    let currentData = getRowsData();
                    let combinedData = currentData.concat(newItemData);
                    let finalData = consolidateData(combinedData);
                    
                    renderRowsData(finalData);
                    log(`+${itemsToFetch.length} itens colados e somados com sucesso!`);
                }
            }
        });


    </script>
